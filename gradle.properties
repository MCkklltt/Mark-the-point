mod_description=A client-side marker/waypoint tool: press V to pin a billboard marker where you look, B opens the settings screen. Optional soft integration with TaCZ (ADS fades the marker out). Everything is fail-safe: missing TaCZ or a missing server-side mod never crashes the game.

