org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod metadata (expanded into META-INF/mods.toml and pack.mcmeta)
mod_id=markthepoint
mod_name=Mark the point
mod_license=MIT
mod_version=1.0.3
mod_group_id=com.markthepoint
